<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <!-- iOS ignores the web app manifest: it needs its own icon and title. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bookmarks AI" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Bookmark Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Explicitly set Tailwind to use the 'class' strategy for dark mode.
      // This allows the manual toggle button to work correctly.
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
</head>
  <body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
