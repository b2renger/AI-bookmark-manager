name: ci

on:
  push:
    branches: [main, v2-local-first, 'v2/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test

  # The 100k-fixture perf assertions (plans/TECHNICAL-DESIGN.md §8.3). Weekly, or on the 'scale' label.
  scale:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'scale')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fixture:gen -- --profile=scale --seed=42 --out=.fixtures/library-100k.db
      - run: npm run test:scale
